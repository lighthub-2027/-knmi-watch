
name: KNMI RegenGrafiek

on:
  workflow_dispatch:

jobs:
  onderzoek:
    runs-on: ubuntu-latest
    steps:
      - name: Python voorbereiden
        run: pip install requests h5py

      - name: KNMI metadata onderzoeken
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          import h5py
          from datetime import datetime, timezone

          base = (
              "https://api.dataplatform.knmi.nl/open-data/v1"
              "/datasets/radar_forecast/versions/2.0/files"
          )
          headers = {"Authorization": os.environ["KNMI_API_KEY"]}

          r = requests.get(
              base, headers=headers,
              params={"maxKeys": 1, "orderBy": "created",
                      "sorting": "desc"},
              timeout=30
          )
          r.raise_for_status()
          info = r.json()["files"][0]

          age = datetime.now(timezone.utc) - datetime.fromisoformat(
              info["created"]
          )
          if age.total_seconds() > 3600:
              raise RuntimeError("KNMI-bestand is te oud")

          r = requests.get(
              f"{base}/{info['filename']}/url",
              headers=headers, timeout=30
          )
          r.raise_for_status()

          r = requests.get(
              r.json()["temporaryDownloadUrl"], timeout=60
          )
          r.raise_for_status()

          with open("radar.h5", "wb") as f:
              f.write(r.content)

          with h5py.File("radar.h5", "r") as f:
              paths = [
                  "/",
                  "geographic",
                  "geographic/map_projection",
                  "image1",
                  "image1/calibration",
                  "image1/image_data",
                  "image2",
                  "image2/calibration",
                  "image24",
              ]

              for path in paths:
                  if path != "/" and path not in f:
                      continue

                  obj = f if path == "/" else f[path]
                  print("\nONDERDEEL:", path, flush=True)

                  for key, value in obj.attrs.items():
                      print(
                          "  ", key, "=",
                          str(value)[:250],
                          flush=True
                      )
          PY
