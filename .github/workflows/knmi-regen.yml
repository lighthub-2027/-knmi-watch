
name: KNMI RegenGrafiek

on:
  workflow_dispatch:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - name: Test KNMI regenverwachting
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: $KNMI_API_KEY" \
            "https://api.dataplatform.knmi.nl/open-data/v1/datasets/radar_forecast/versions/2.0/files?maxKeys=5"

          echo "KNMI regenverwachting bereikbaar"
