name: KNMI RegenGrafiek

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

concurrency:
  group: knmi-rain-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer bibliotheken
        run: python -m pip install -r requirements.txt
      - name: Maak KNMI-grafiek
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
        run: python make_rain.py
      - name: Publiceer bijgewerkte grafiek
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rain.png docs/complicajson.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update KNMI rain forecast"
            git push
          fi
